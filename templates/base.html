<!DOCTYPE html>
<html lang="ru" class="h-full bg-stone-100 text-slate-900 antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EcoRelocate — Навигатор по сортировке мусора при релокации{% endblock %}</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pine: {
                            50: '#f2f7f4',
                            600: '#2d6a4f',
                            700: '#1b4332',
                            900: '#081c15',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', system-ui, -apple-system, sans-serif],
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome & Leaflet CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

    <!-- Прямое подключение пользовательских стилей -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="min-h-full flex flex-col selection:bg-emerald-600 selection:text-white">

    <!-- НАВИГАЦИОННЫЙ ХЕДЕР -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="/" class="flex items-center space-x-3 group focus:outline-none">
                <div class="w-9 h-9 bg-emerald-600 text-white flex items-center justify-center rounded font-bold tracking-wider text-sm transition-transform group-hover:scale-105 shadow">
                    ER
                </div>
                <div>
                    <span class="font-bold text-white tracking-tight text-lg">EcoRelocate</span>
                    <span class="block text-[11px] text-slate-400 font-medium">Сортировка без стресса</span>
                </div>
            </a>
            
            <nav class="hidden md:flex items-center space-x-8 text-sm font-medium text-slate-300">
                <a href="/" class="hover:text-white transition-colors">Правила сортировки</a>
                <a href="/community" class="hover:text-white transition-colors">Советы экспатов</a>
                <a href="/docs" target="_blank" class="text-slate-400 hover:text-slate-200 transition-colors flex items-center gap-1.5">
                    <span>API</span>
                    <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                </a>
            </nav>

            <div class="flex items-center space-x-4">
                <a href="/community" class="inline-flex items-center justify-center px-4 py-2 text-sm font-semibold text-white bg-emerald-600 hover:bg-emerald-500 rounded transition-colors shadow">
                    Добавить совет
                </a>
            </div>
        </div>
    </header>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="flex-grow">
        {% block content %}
        {% endblock %}
    </main>

    <!-- ФУТЕР -->
    <footer class="bg-slate-900 border-t border-slate-800 text-slate-400 mt-auto py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs">
            <p>© 2026 EcoRelocate. Открытый инструмент для интеграции в новую городскую среду.</p>
            <div class="flex space-x-6">
                <a href="/" class="hover:text-white transition-colors">Конфиденциальность</a>
                <a href="/docs" class="hover:text-white transition-colors">Документация API</a>
            </div>
        </div>
    </footer>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Клиентские скрипты приложения -->
    <script src="/static/js/script.js"></script>
</body>
</html>
