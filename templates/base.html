<!-- FILE: base.html -->
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F7F5F0" />
  <title>{% block title %}EcoRelocate — Навигатор по сортировке при переезде{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Spacing scale (4px / 8px rhythm) */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-10: 40px;
      --space-12: 48px;
      --container-max: 1180px;

      /* Typography scale */
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-serif: "Newsreader", Georgia, serif;
      --text-xs: 0.75rem;
      --text-sm: 0.875rem;
      --text-base: 1rem;
      --text-lg: 1.125rem;
      --text-xl: 1.35rem;
      --text-2xl: clamp(1.55rem, 2.5vw, 2.25rem);

      /* Palette & semantic tokens */
      --bg-canvas: #F7F5F0;
      --bg-surface: #FFFFFF;
      --bg-subtle: #EFECE4;
      --bg-accent-soft: #E5EFEA;
      --bg-warn-soft: #F9ECE6;
      --bg-info-soft: #EBF1F6;

      --text-primary: #18221F;
      --text-secondary: #46544F;
      --text-muted: #62706B;

      --border-subtle: #DFDBD0;
      --border-strong: #C3BDB0;

      --accent-primary: #2B5948;
      --accent-primary-hover: #214538;
      --accent-warn: #B85D3B;
      --accent-info: #355C7D;

      /* Bin semantic tokens */
      --bin-yellow: #C6981C;
      --bin-blue: #2F5E8A;
      --bin-green: #2B6E4E;
      --bin-brown: #6E4F3A;
      --bin-grey: #4E5654;

      /* Micro-details */
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-card: 0 1px 2px rgba(24, 34, 31, 0.05), 0 6px 18px rgba(24, 34, 31, 0.03);
      --transition-fast: 160ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: var(--text-base);
      line-height: 1.55;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    :focus-visible {
      outline: 2px solid var(--accent-primary);
      outline-offset: 2px;
    }

    .container {
      width: 100%;
      max-width: var(--container-max);
      margin: 0 auto;
      padding-inline: var(--space-4);
    }

    @media (min-width: 768px) {
      .container { padding-inline: var(--space-6); }
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
